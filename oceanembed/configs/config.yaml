# oceanembed configuration
# Defines the study region, spatial resolution, vertical depth levels,
# and date range used across preprocessing, training, and validation.

region:
  lat_min: 5
  lat_max: 30
  lon_min: 45
  lon_max: 105

resolution_deg: 0.25

depth_levels:  # meters
  - 0
  - 5
  - 10
  - 20
  - 30
  - 50
  - 75
  - 100
  - 125
  - 150
  - 200
  - 300
  - 500
  - 700
  - 1000

date_range:
  start: "YYYY-MM-DD"  # placeholder, e.g. "2015-01-01"
  end: "YYYY-MM-DD"    # placeholder, e.g. "2023-12-31"
